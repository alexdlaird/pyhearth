[project]
name = "pyhearth"
dynamic = ["version"]
description = "A Python client for Hearth's home API: post a thermostat and room sensor readings to a Hearth home"
readme = "README.md"
license = "MIT"
keywords = ["hearth", "thermostat", "climate", "room-sensors", "home-automation", "daikin", "asyncio"]
authors = [{ name = "Alex Laird", email = "contact@alexlaird.com" }]
maintainers = [{ name = "Alex Laird", email = "contact@alexlaird.com" }]
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]",
    "flake8",
    "flake8-pyproject",
    "pep8-naming",
    "mypy"
]

[project.urls]
Changelog = "https://github.com/alexdlaird/pyhearth/blob/main/CHANGELOG.md"
Documentation = "https://github.com/alexdlaird/pyhearth#readme"
Sponsor = "https://github.com/sponsors/alexdlaird"
"Source Code" = "https://github.com/alexdlaird/pyhearth"

[tool.setuptools]
package-dir = { pyhearth = "pyhearth" }

[tool.setuptools.package-data]
pyhearth = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "pyhearth.__version__" }

[tool.coverage.run]
omit = [
    "venv/**",
    "*/tests/**"
]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.xml]
output = "build/coverage/coverage.xml"

[tool.coverage.html]
title = "Coverage Report"
directory = "build/coverage"

[tool.mypy]
strict = true

[tool.flake8]
max-line-length = 119
statistics = true
exclude = "venv/*,build/*,dist/*,.egg-info/*"
